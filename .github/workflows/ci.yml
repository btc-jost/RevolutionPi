name: CI

on:
  push:
    branches: [ master, updates ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RevolutionPi.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build RevolutionPi.sln -c Release --no-restore -warnaserror

      - name: Verify formatting
        run: dotnet format RevolutionPi.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test RevolutionPi.sln -c Release --no-build --verbosity minimal
